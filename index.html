<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Register</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;color:#eee;display:flex}

.sidenav{width:180px;background:#0f3460;display:flex;flex-direction:column;padding:14px 10px;border-right:2px solid #16213e;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:width .2s;overflow:hidden}
.sidenav.collapsed{width:56px}
.sidenav .toggle{cursor:pointer;color:#888;font-size:18px;text-align:right;margin-bottom:10px;user-select:none;padding:4px 8px;border-radius:4px}
.sidenav .toggle:hover{color:#fff;background:#16213e}
.sidenav.collapsed .nav-text{display:none}
.sidenav.collapsed .toggle{text-align:center}
.sidenav a{display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;color:#888;font-weight:bold;font-size:13px;border-radius:6px;white-space:nowrap}
.sidenav a:hover{background:#16213e;color:#fff}
.sidenav a.active{background:#e94560;color:#fff}

.main{margin-left:180px;flex:1;display:flex;flex-direction:column;height:100vh;transition:margin-left .2s;overflow:hidden}
.sidenav.collapsed~.main{margin-left:56px}

.hdr{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-shrink:0}
.hdr h2{font-size:15px;color:#06d6a0}
.btn{padding:6px 12px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:11px}
.b-more{background:#f4a261;color:#111}.b-add{background:#06d6a0;color:#111}
.b-del{background:#e94560;color:#fff;padding:2px 6px;font-size:9px}

.tw{flex:1;overflow:auto;border:1px solid #0f3460;margin:0 16px}
table{width:100%;border-collapse:collapse}
th{background:#0f3460;padding:8px 10px;font-size:11px;text-align:left;border-bottom:2px solid #16213e;position:sticky;top:0;z-index:1}
th.req{color:#e94560}.th-opt{color:#f4a261}
td{padding:4px 8px;border-bottom:1px solid #1a1a2e;font-size:12px}
tr:nth-child(even){background:#16213e}
tr:hover{background:#0f3460}
td input,td select{background:#1a1a2e;border:1px solid #333;color:#eee;padding:5px 8px;border-radius:3px;font-size:12px;width:100%}
td input:focus,td select:focus{border-color:#00b4d8;outline:none}
td.ctr{text-align:center}
.optc{display:none}.optc.show{display:table-cell}

.sbar{display:flex;gap:14px;padding:8px 16px;background:#16213e;border-top:1px solid #0f3460;flex-shrink:0;font-size:11px;color:#888}
.sbar span{color:#06d6a0;font-weight:bold}
</style>
</head>
<body>

<div class="sidenav" id="sidenav">
  <div class="toggle" onclick="toggleNav()">&#9776;</div>
  <a href="/" class="active nav-text"><span>&#9638;</span> Data Register</a>
  <a href="/rbd" class="nav-text" onclick="event.preventDefault();location.href='/rbd?t='+Date.now()"><span>&#9634;</span> RBD Sheet</a>
</div>

<div class="main">
  <div class="hdr">
    <h2>Component / LRU Register</h2>
    <button class="btn b-more" id="btnMore" onclick="toggleOpt()">More</button>
    <button class="btn b-add" onclick="addNew()">+ Add</button>
  </div>
  <div class="tw">
    <table id="tbl">
      <thead><tr>
        <th style="width:40px">#</th>
        <th class="req">Component / LRU</th>
        <th class="req">Part No.</th>
        <th class="req">&lambda;</th>
        <th class="req">MTBF (hrs)</th>
        <th class="req">MTTR (hrs)</th>
        <th class="req">Op Time (H)</th>
        <th class="req">Repair</th>
        <th class="th-opt optc">FIT</th>
        <th class="th-opt optc">FPMH</th>
        <th style="width:40px"></th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="sbar">
    <div>Total: <span id="cnt">0</span></div>
    <div id="dbg"></div>
  </div>
</div>

<script>
var optShow=false;
var defaults=[
  {name:"Power Supply",partNo:"PS-1001",lambda:"5.0e-6",mtbf:200000,mttr:4,opTime:8760,repair:"Repairable",fit:5,fpmh:5},
  {name:"Processor",partNo:"CPU-2001",lambda:"2.0e-6",mtbf:500000,mttr:2,opTime:8760,repair:"Repairable",fit:2,fpmh:2},
  {name:"Memory Module",partNo:"MEM-3001",lambda:"1.0e-6",mtbf:1000000,mttr:1,opTime:8760,repair:"Repairable",fit:1,fpmh:1},
  {name:"Sensor",partNo:"SNS-4001",lambda:"3.0e-6",mtbf:333333,mttr:3,opTime:8760,repair:"Repairable",fit:3,fpmh:3},
  {name:"Communication Module",partNo:"COM-5001",lambda:"4.0e-6",mtbf:250000,mttr:6,opTime:8760,repair:"Repairable",fit:4,fpmh:4},
  {name:"Display Unit",partNo:"DSP-6001",lambda:"1.5e-6",mtbf:666667,mttr:2,opTime:8760,repair:"Repairable",fit:1.5,fpmh:1.5},
  {name:"Cooling Fan",partNo:"FAN-7001",lambda:"10.0e-6",mtbf:100000,mttr:1,opTime:8760,repair:"Non Repairable",fit:10,fpmh:10},
  {name:"Battery",partNo:"BAT-8001",lambda:"8.0e-6",mtbf:125000,mttr:8,opTime:8760,repair:"Non Repairable",fit:8,fpmh:8}
];

function toggleNav(){document.getElementById('sidenav').classList.toggle('collapsed');}

function load(){
  fetch('/api/components').then(function(r){return r.json();}).then(function(d){
    if(d&&d.length){
      for(var i=0;i<d.length;i++){addRow(d[i]);}
    }else{
      for(var i=0;i<defaults.length;i++){addRow(defaults[i]);}
      persist();
    }
    cnt();
    document.getElementById('dbg').textContent='Loaded: '+document.getElementById('tb').children.length+' components';
  }).catch(function(e){
    for(var i=0;i<defaults.length;i++){addRow(defaults[i]);}
    cnt();
    document.getElementById('dbg').textContent='API error, loaded defaults';
  });
}

function addRow(data){
  var tb=document.getElementById('tb');
  var tr=document.createElement('tr');
  var n=tb.children.length+1;
  var d=data||{};
  var html='';
  html+='<td class="ctr">'+n+'</td>';
  html+='<td><input type="text" value="'+esc(d.name||'')+'" placeholder="Component Name"></td>';
  html+='<td><input type="text" value="'+esc(d.partNo||'')+'" placeholder="Part No"></td>';
  html+='<td><input type="text" value="'+esc(d.lambda||'')+'" placeholder="e.g. 5e-6"></td>';
  html+='<td><input type="number" value="'+(d.mtbf||'')+'" placeholder="MTBF"></td>';
  html+='<td><input type="number" value="'+(d.mttr||'')+'" step="0.1" placeholder="MTTR"></td>';
  html+='<td><input type="number" value="'+(d.opTime||'')+'" placeholder="Hours"></td>';
  html+='<td><select>';
  html+='<option value="Repairable"'+(d.repair==='Repairable'?' selected':'')+'>Repairable</option>';
  html+='<option value="Non Repairable"'+(d.repair==='Non Repairable'?' selected':'')+'>Non Repairable</option>';
  html+='</select></td>';
  html+='<td class="ctr optc"><input type="text" value="'+(d.fit||'')+'" placeholder="FIT"></td>';
  html+='<td class="ctr optc"><input type="text" value="'+(d.fpmh||'')+'" placeholder="FPMH"></td>';
  html+='<td class="ctr"><button class="btn b-del" onclick="delRow(this)">X</button></td>';
  tr.innerHTML=html;

  var inputs=tr.querySelectorAll('input');
  var lamInput=inputs[2];
  var mtbfInput=inputs[3];
  var mttrInput=inputs[4];

  lamInput.addEventListener('input',function(){
    var lam=parseFloat(this.value);
    if(lam>0&&mtbfInput.value===''){mtbfInput.value=Math.round(1/lam);}
    persist();
  });
  mtbfInput.addEventListener('input',function(){
    var mb=parseFloat(this.value);
    if(mb>0&&lamInput.value===''){lamInput.value=(1/mb).toExponential(2);}
    persist();
  });
  mttrInput.addEventListener('input',function(){persist();});

  tb.appendChild(tr);
}

function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function addNew(){addRow({});cnt();persist();}

function delRow(b){b.closest('tr').remove();renum();cnt();persist();}
function renum(){var rows=document.querySelectorAll('#tb tr');for(var i=0;i<rows.length;i++){rows[i].children[0].textContent=i+1;}}

function toggleOpt(){
  optShow=!optShow;
  var cells=document.querySelectorAll('.optc');
  for(var i=0;i<cells.length;i++){cells[i].classList.toggle('show',optShow);}
  document.getElementById('btnMore').textContent=optShow?'Less':'More';
}

function gather(){
  var d=[];
  var rows=document.querySelectorAll('#tb tr');
  for(var i=0;i<rows.length;i++){
    var tr=rows[i];
    var inputs=tr.querySelectorAll('input');
    if(inputs.length<8)continue;
    var nm=inputs[0].value.trim();
    if(!nm)continue;
    var sel=tr.querySelector('select');
    d.push({
      name:nm,
      partNo:inputs[1].value.trim(),
      lambda:inputs[2].value.trim(),
      mtbf:parseFloat(inputs[3].value)||0,
      mttr:parseFloat(inputs[4].value)||0,
      opTime:parseFloat(inputs[5].value)||0,
      repair:sel?sel.value:'Repairable',
      fit:parseFloat(inputs[6].value)||0,
      fpmh:parseFloat(inputs[7].value)||0
    });
  }
  return d;
}

function persist(){
  var d=gather();
  var j=JSON.stringify(d);
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/components',false);
  xhr.setRequestHeader('Content-Type','application/json');
  try{xhr.send(j);document.getElementById('dbg').textContent='Saved: '+d.length+' components';}
  catch(e){document.getElementById('dbg').textContent='Save FAILED: '+e.message;}
}

document.getElementById('tbl').addEventListener('input',persist);
document.getElementById('tbl').addEventListener('change',persist);
window.addEventListener('beforeunload',function(){
  var d=gather();
  navigator.sendBeacon('/api/components',new Blob([JSON.stringify(d)],{type:'application/json'}));
});

function cnt(){document.getElementById('cnt').textContent=document.getElementById('tb').children.length;}

load();
</script>
</body>
</html>

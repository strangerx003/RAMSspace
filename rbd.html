<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBD Sheet</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#1a1a2e;color:#eee;height:100vh;overflow:hidden;display:flex}
.sidenav{width:180px;background:#0f3460;display:flex;flex-direction:column;padding:14px 10px;border-right:2px solid #16213e;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:width .2s;overflow:hidden}
.sidenav.collapsed{width:56px}
.sidenav .toggle{cursor:pointer;color:#888;font-size:18px;text-align:right;margin-bottom:10px;user-select:none;padding:4px 8px;border-radius:4px}
.sidenav .toggle:hover{color:#fff;background:#16213e}
.sidenav.collapsed .nav-text{display:none}
.sidenav.collapsed .toggle{text-align:center}
.sidenav a{display:flex;align-items:center;gap:10px;padding:10px 12px;text-decoration:none;color:#888;font-weight:bold;font-size:13px;border-radius:6px;white-space:nowrap}
.sidenav a:hover{background:#16213e;color:#fff}
.sidenav a.active{background:#e94560;color:#fff}
.app{margin-left:180px;display:flex;flex:1;height:100vh;transition:margin-left .2s}
.sidenav.collapsed~.app{margin-left:56px}
.library{width:210px;background:#16213e;border-right:2px solid #0f3460;display:flex;flex-direction:column;padding:10px;overflow-y:auto;flex-shrink:0}
.library h3{font-size:12px;color:#e94560;border-bottom:1px solid #0f3460;padding-bottom:6px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.lib-empty{color:#666;font-size:10px;text-align:center;margin-top:30px;line-height:1.8}
.lib-empty a{color:#00b4d8}
.lib-status{margin-top:auto;padding-top:8px;border-top:1px solid #0f3460;font-size:9px;color:#555}
.bi{background:linear-gradient(135deg,#0f3460,#16213e);border:2px solid #00b4d8;border-radius:7px;padding:8px;margin-bottom:6px;cursor:grab;transition:transform .15s,box-shadow .15s;user-select:none}
.bi:hover{transform:scale(1.03);box-shadow:0 0 10px rgba(0,180,216,.35)}
.bi:active{cursor:grabbing}
.bi-name{font-size:10px;font-weight:bold;color:#00b4d8}
.bi-lam{font-size:9px;color:#e94560;font-family:monospace}
.bi-mtbf{font-size:9px;color:#06d6a0}
.bi-mttr{font-size:9px;color:#f4a261}
.right{flex:1;display:flex;flex-direction:column}
.toolbar{background:#0f3460;padding:5px 12px;display:flex;gap:5px;align-items:center;border-bottom:2px solid #16213e;flex-wrap:wrap}
.toolbar button{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;font-weight:bold;font-size:10px}
.bline{background:#555;color:#fff;border:2px solid transparent!important}
.bline:hover{background:#666}
.bline.active{border-color:#e94560!important;animation:p 1s infinite}
@keyframes p{0%,100%{box-shadow:0 0 4px #e94560}50%{box-shadow:0 0 12px #e94560}}
.bst{background:#00b4d8;color:#fff}
.bra{background:#7209b7;color:#fff}
.brun{background:#06d6a0;color:#111}
.bclr{background:#e94560;color:#fff}
.brst{background:#f4a261;color:#111}
.sep{width:1px;height:20px;background:#1a1a2e;margin:0 2px}
.mind{margin-left:auto;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:bold}
.m-idle{background:#555}
.m-st{background:#00b4d8}
.m-ra{background:#7209b7}
.ws{flex:1;position:relative;background:#1a1a2e;overflow:hidden}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle,#2a2a4a 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
.svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.svg path{pointer-events:stroke;cursor:pointer;transition:stroke .15s}
.svg path:hover{stroke:#f4a261!important;stroke-width:4!important}
.svg path.selected{stroke:#e94560!important;stroke-width:4!important;filter:drop-shadow(0 0 6px #e94560)}
.tl{stroke:#e94560;stroke-width:2;stroke-dasharray:8 4}
.cb{position:absolute;background:linear-gradient(135deg,#0f3460,#1a1a2e);border:2px solid #00b4d8;border-radius:4px;padding:10px 12px;cursor:move;z-index:2;min-width:120px;max-width:160px;text-align:center;user-select:none;transition:box-shadow .2s}
.cb:hover{box-shadow:0 0 14px rgba(0,180,216,.35)}
.cb-name{font-size:11px;font-weight:bold;color:#00b4d8;margin-bottom:3px}
.cb-lam{font-size:10px;color:#e94560;font-family:monospace;margin-bottom:1px}
.cb-mtbf{font-size:10px;color:#06d6a0;margin-bottom:1px}
.cb-mttr{font-size:10px;color:#f4a261}
.xbtn{position:absolute;top:-5px;right:-5px;width:14px;height:14px;background:#e94560;border:none;border-radius:50%;color:#fff;font-size:9px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:10}
.cb:hover .xbtn{display:flex}
.port{position:absolute;width:11px;height:11px;background:#06d6a0;border:2px solid #fff;border-radius:50%;cursor:crosshair;z-index:5;transition:all .2s}
.port:hover{transform:scale(1.5);background:#e94560;box-shadow:0 0 8px rgba(233,69,96,.7)}
.pl{left:-5px;top:50%;transform:translateY(-50%)}
.pr{right:-5px;top:50%;transform:translateY(-50%)}
.pl:hover{transform:translateY(-50%) scale(1.5)}
.pr:hover{transform:translateY(-50%) scale(1.5)}
.port.conn{background:#f4a261}
.res{background:#16213e;border-top:2px solid #0f3460;padding:8px 12px;min-height:50px;max-height:120px;overflow-y:auto}
.res h3{color:#06d6a0;margin-bottom:3px;font-size:11px}
.rc{font-size:10px;line-height:1.5}
.re{font-size:14px;font-weight:bold;color:#e94560;margin-top:2px}
.ld{color:#f4a261;font-style:italic}
</style>
</head>
<body>

<div class="sidenav" id="sidenav">
  <div class="toggle" onclick="toggleNav()">&#9776;</div>
  <a href="/" class="nav-text" onclick="event.preventDefault();location.href='/?t='+Date.now()"><span>&#9638;</span> Data Register</a>
  <a href="/rbd" class="active nav-text"><span>&#9634;</span> RBD Sheet</a>
</div>

<div class="app">
  <div class="library">
    <h3>Components <span onclick="loadLib()" style="cursor:pointer;color:#06d6a0;font-size:16px" title="Refresh">&#8635;</span></h3>
    <div id="lib"></div>
    <div class="lib-empty" id="empty">No components.<br><a href="/">Register</a> first.</div>
    <div class="lib-status" id="lstat"></div>
  </div>
  <div class="right">
    <div class="toolbar">
      <button class="bline bst" id="bSt" onclick="setLM('st')"><svg width="14" height="6" style="vertical-align:middle"><line x1="0" y1="3" x2="14" y2="3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="bline bra" id="bRa" onclick="setLM('ra')"><svg width="14" height="8" style="vertical-align:middle"><polyline points="0,3 5,3 5,7 14,7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="sep"></div>
      <button class="brun" onclick="run()">Run</button>
      <button class="bclr" onclick="clr()">Clear</button>
      <button class="brst" onclick="rst()">Reset</button>
      <div class="mind m-idle" id="mind">Drag blocks</div>
    </div>
    <div class="ws" id="ws"><div class="grid"></div><svg class="svg" id="svg"></svg></div>
    <div class="res"><h3>Results</h3><div class="rc" id="rc">Drag or click components, connect ports, then <strong>Run Analysis</strong>.</div></div>
  </div>
</div>

<script>
var API = '/api/analyze-rbd';
var cbs = [];
var conns = [];
var nid = 1;
var lm = null;
var cs = null;
var scId = null;

var ws, svg, mind;

function init() {
  ws = document.getElementById('ws');
  svg = document.getElementById('svg');
  mind = document.getElementById('mind');
  loadLib();
  setupDrop();
  setupKeys();
}

function toggleNav() {
  document.getElementById('sidenav').classList.toggle('collapsed');
}

function fmtIN(n) {
  if (!n) return '0';
  var s = Math.round(n).toString();
  var l = s.slice(-3);
  var r = s.slice(0, -3);
  if (r) l = r.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + l;
  return l;
}

function fmtSCI(v) {
  if (!v) return '0';
  return Number(v).toExponential(2);
}

function loadLib() {
  var lib = document.getElementById('lib');
  var emp = document.getElementById('empty');
  var st = document.getElementById('lstat');
  lib.innerHTML = '';
  emp.style.display = 'block';
  st.textContent = 'Loading...';

  fetch('/api/components')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      lib.innerHTML = '';
      if (!data || !data.length) {
        emp.style.display = 'block';
        st.textContent = 'No components registered.';
        return;
      }
      emp.style.display = 'none';
      st.textContent = data.length + ' components';

      data.forEach(function(c) {
        var d = document.createElement('div');
        d.className = 'bi';

        var showLambda = parseFloat(c.lambda) || 0;
        if (!showLambda && c.mtbf > 0) showLambda = 1.0 / c.mtbf;

        var h = '<div class="bi-name">' + (c.name || 'Unnamed') + '</div>';
        if (showLambda) h += '<div class="bi-lam">&lambda;=' + fmtSCI(showLambda) + '</div>';
        if (c.mtbf) h += '<div class="bi-mtbf">MTBF:' + fmtIN(c.mtbf) + '</div>';
        if (c.mttr) h += '<div class="bi-mttr">MTTR:' + c.mttr + 'hrs</div>';
        d.innerHTML = h;

        d.setAttribute('draggable', 'true');

        d.addEventListener('dragstart', function(e) {
          e.dataTransfer.setData('text/plain', JSON.stringify(c));
          e.dataTransfer.effectAllowed = 'copy';
        });

        d.addEventListener('click', function() {
          var rect = ws.getBoundingClientRect();
          addBlk(c, rect.width / 2 - 60 + (Math.random() * 40 - 20), rect.height / 2 - 30 + (Math.random() * 30 - 15));
        });

        lib.appendChild(d);
      });
    })
    .catch(function(e) {
      emp.style.display = 'block';
      st.textContent = 'Load failed: ' + e.message;
    });
}

function setupDrop() {
  ws.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  ws.addEventListener('drop', function(e) {
    e.preventDefault();
    if (lm) return;
    try {
      var raw = e.dataTransfer.getData('text/plain');
      var c = JSON.parse(raw);
      var r = ws.getBoundingClientRect();
      addBlk(c, e.clientX - r.left - 60, e.clientY - r.top - 20);
    } catch (x) {
      console.error('Drop failed:', x);
    }
  });
}

function addBlk(c, x, y) {
  var id = nid++;
  var el = document.createElement('div');
  el.className = 'cb';
  el.dataset.bid = id;

  var displayLambda = parseFloat(c.lambda) || 0;
  if (!displayLambda && c.mtbf > 0) displayLambda = 1.0 / c.mtbf;

  var h = '<button class="xbtn" onclick="rmBlk(' + id + ')">&times;</button>';
  h += '<div class="cb-name">' + (c.name || 'Unnamed') + '</div>';
  if (displayLambda) h += '<div class="cb-lam">&lambda;=' + fmtSCI(displayLambda) + '</div>';
  if (c.mtbf) h += '<div class="cb-mtbf">MTBF:' + fmtIN(c.mtbf) + '</div>';
  if (c.mttr) h += '<div class="cb-mttr">MTTR:' + c.mttr + 'hrs</div>';
  h += '<div class="port pl" data-bid="' + id + '" data-s="left"></div>';
  h += '<div class="port pr" data-bid="' + id + '" data-s="right"></div>';
  el.innerHTML = h;

  el.style.left = x + 'px';
  el.style.top = y + 'px';
  ws.appendChild(el);

  var b = { id: id, el: el, c: c, x: x, y: y };
  cbs.push(b);
  mkDrag(el, b);

  var ports = el.querySelectorAll('.port');
  for (var i = 0; i < ports.length; i++) {
    (function(p) {
      p.addEventListener('mousedown', function(e) {
        e.stopPropagation();
        if (!lm) return;
        var bid = parseInt(p.dataset.bid);
        var s = p.dataset.s;
        if (!cs) {
          cs = { bid: bid, s: s, el: p };
          p.style.background = '#e94560';
          showTL(p);
        } else {
          if (cs.bid === bid) { cs.el.style.background = '#06d6a0'; cs = null; rmTL(); return; }
          var dup = false;
          for (var j = 0; j < conns.length; j++) {
            var cn = conns[j];
            if ((cn.f.bid === cs.bid && cn.f.s === cs.s && cn.t.bid === bid && cn.t.s === s) ||
                (cn.f.bid === bid && cn.f.s === s && cn.t.bid === cs.bid && cn.t.s === cs.s)) { dup = true; break; }
          }
          if (!dup) mkConn(cs.bid, cs.s, bid, s);
          cs.el.style.background = '#06d6a0';
          cs = null;
          rmTL();
        }
      });
    })(ports[i]);
  }
}

function mkDrag(el, b) {
  el.addEventListener('mousedown', function(e) {
    if (e.target.closest('.port') || e.target.closest('.xbtn')) return;
    if (lm) return;
    e.preventDefault();
    var sx = e.clientX, sy = e.clientY;
    var ox = parseInt(el.style.left), oy = parseInt(el.style.top);
    el.style.zIndex = 10;
    var mv = function(ev) {
      var nx = ox + ev.clientX - sx, ny = oy + ev.clientY - sy;
      el.style.left = nx + 'px'; el.style.top = ny + 'px';
      b.x = nx; b.y = ny;
      updConns();
    };
    var up = function() {
      document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up);
      el.style.zIndex = 2;
    };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
}

function gPC(bid, s) {
  var b = null;
  for (var i = 0; i < cbs.length; i++) { if (cbs[i].id === bid) { b = cbs[i]; break; } }
  if (!b) return { x: 0, y: 0 };
  var bw = b.el.offsetWidth, bh = b.el.offsetHeight;
  return s === 'left' ? { x: b.x, y: b.y + bh / 2 } : { x: b.x + bw, y: b.y + bh / 2 };
}

function mkConn(fb, fs, tb, ts) {
  var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('stroke', '#06d6a0');
  p.setAttribute('stroke-width', '3');
  p.setAttribute('fill', 'none');
  p.setAttribute('stroke-linecap', 'round');
  p.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(p);
  var cn = { id: Date.now() + Math.random(), f: { bid: fb, s: fs }, t: { bid: tb, s: ts }, el: p, mode: lm };
  conns.push(cn);
  drP(cn);
  p.addEventListener('click', function(e) { e.stopPropagation(); selCN(cn.id); });
  updPV();
}

function drP(c) {
  var p1 = gPC(c.f.bid, c.f.s), p2 = gPC(c.t.bid, c.t.s);
  if (c.mode === 'st') {
    c.el.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y);
  } else {
    if (Math.abs(p2.x - p1.x) < 10) {
      c.el.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y);
    } else {
      var mx = p1.x + (p2.x - p1.x) / 2;
      c.el.setAttribute('d', 'M ' + p1.x + ' ' + p1.y + ' L ' + mx + ' ' + p1.y + ' L ' + mx + ' ' + p2.y + ' L ' + p2.x + ' ' + p2.y);
    }
  }
}

function updConns() { for (var i = 0; i < conns.length; i++) drP(conns[i]); }

function updPV() {
  var ports = document.querySelectorAll('.port');
  for (var i = 0; i < ports.length; i++) ports[i].classList.remove('conn');
  for (var i = 0; i < conns.length; i++) {
    var cn = conns[i];
    var b1 = null, b2 = null;
    for (var j = 0; j < cbs.length; j++) {
      if (cbs[j].id === cn.f.bid) b1 = cbs[j];
      if (cbs[j].id === cn.t.bid) b2 = cbs[j];
    }
    if (b1) { var p = b1.el.querySelector(cn.f.s === 'left' ? '.pl' : '.pr'); if (p) p.classList.add('conn'); }
    if (b2) { var p = b2.el.querySelector(cn.t.s === 'left' ? '.pl' : '.pr'); if (p) p.classList.add('conn'); }
  }
}

function selCN(id) { deselCN(); scId = id; for (var i = 0; i < conns.length; i++) { if (conns[i].id === id) { conns[i].el.classList.add('selected'); break; } } }
function deselCN() { if (scId !== null) { for (var i = 0; i < conns.length; i++) { if (conns[i].id === scId) { conns[i].el.classList.remove('selected'); break; } } scId = null; } }
function delSC() { if (scId === null) return; for (var i = 0; i < conns.length; i++) { if (conns[i].id === scId) { conns[i].el.remove(); conns.splice(i, 1); break; } } scId = null; updPV(); }

function setupKeys() {
  document.addEventListener('keydown', function(e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && scId !== null) { e.preventDefault(); delSC(); }
    if (e.key === 'Escape') { deselCN(); ccn(); setLM(null); }
  });
}

var tl = null;
function showTL(p) {
  tl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  tl.classList.add('tl');
  var r = p.getBoundingClientRect(), wr = ws.getBoundingClientRect();
  var cx = r.left + r.width / 2 - wr.left, cy = r.top + r.height / 2 - wr.top;
  tl.setAttribute('d', 'M ' + cx + ' ' + cy + ' L ' + cx + ' ' + cy);
  svg.appendChild(tl);
  ws.addEventListener('mousemove', onTM);
}
function onTM(e) {
  if (!tl) return;
  var wr = ws.getBoundingClientRect(), ex = e.clientX - wr.left, ey = e.clientY - wr.top;
  var d = tl.getAttribute('d');
  var sx = parseFloat(d.match(/M\s([\d.]+)/)[1]);
  var sy = parseFloat(d.match(/M\s[\d.]+\s([\d.]+)/)[1]);
  if (lm === 'st') { tl.setAttribute('d', 'M ' + sx + ' ' + sy + ' L ' + ex + ' ' + ey); }
  else { var mx = sx + (ex - sx) / 2; tl.setAttribute('d', 'M ' + sx + ' ' + sy + ' L ' + mx + ' ' + sy + ' L ' + mx + ' ' + ey + ' L ' + ex + ' ' + ey); }
}
function rmTL() { if (tl) { tl.remove(); tl = null; } ws.removeEventListener('mousemove', onTM); }
function ccn() { if (cs) { cs.el.style.background = '#06d6a0'; cs = null; } rmTL(); }

function setLM(m) {
  lm = lm === m ? null : m;
  ccn();
  document.getElementById('bSt').classList.toggle('active', lm === 'st');
  document.getElementById('bRa').classList.toggle('active', lm === 'ra');
  if (lm === 'st') { mind.textContent = 'Click two ports'; mind.className = 'mind m-st'; }
  else if (lm === 'ra') { mind.textContent = 'Click two ports'; mind.className = 'mind m-ra'; }
  else { mind.textContent = 'Drag blocks'; mind.className = 'mind m-idle'; }
}

function rmBlk(id) {
  for (var i = 0; i < cbs.length; i++) {
    if (cbs[i].id === id) { cbs[i].el.remove(); cbs.splice(i, 1); break; }
  }
  var rem = [];
  for (var i = 0; i < conns.length; i++) {
    if (conns[i].f.bid === id || conns[i].t.bid === id) { conns[i].el.remove(); }
    else rem.push(conns[i]);
  }
  conns = rem;
  updPV();
}
function clr() {
  for (var i = 0; i < cbs.length; i++) cbs[i].el.remove();
  cbs = [];
  for (var i = 0; i < conns.length; i++) conns[i].el.remove();
  conns = [];
  scId = null;
  document.getElementById('rc').innerHTML = 'Drag or click components, connect ports, then <strong>Run Analysis</strong>.';
}
function rst() { document.getElementById('rc').innerHTML = 'Drag or click components, connect ports, then <strong>Run Analysis</strong>.'; }

function run() {
  if (!cbs.length) { showR('No blocks. Drag components first.'); return; }
  if (!conns.length) { showR('No connections. Click two ports.'); return; }
  showR('<span class="ld">Analyzing...</span>');

  var payload = { blocks: [], connections: [] };

  for (var i = 0; i < cbs.length; i++) {
    var b = cbs[i];
    var lam = parseFloat(b.c.lambda) || 0;
    if (!lam && parseFloat(b.c.mtbf) > 0) lam = 1.0 / parseFloat(b.c.mtbf);
    payload.blocks.push({
      id: b.id, name: b.c.name, lambda: lam,
      mtbf: parseFloat(b.c.mtbf) || 0,
      mttr: parseFloat(b.c.mttr) || 0,
      opTime: parseFloat(b.c.opTime) || 0,
      repair: b.c.repair || 'Repairable'
    });
  }

  for (var i = 0; i < conns.length; i++) {
    payload.connections.push({
      from: { blockId: conns[i].f.bid, side: conns[i].f.s },
      to: { blockId: conns[i].t.bid, side: conns[i].t.s }
    });
  }

  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.error) { showR(d.error); return; }
    var h = '<div><strong>Components:</strong> ' + d.block_count + ' | <strong>Connections:</strong> ' + d.connection_count + '</div><hr style="border-color:#0f3460;margin:4px 0">';
    if (d.steps && d.steps.length) {
      h += '<div style="margin-bottom:4px"><strong>Steps:</strong></div>';
      for (var i = 0; i < d.steps.length; i++) {
        var s = d.steps[i];
        var sep = s.type === 'parallel' ? ' || ' : ' + ';
        h += '<div style="color:#aaa;margin-bottom:1px">' + (i + 1) + '. [' + s.type.toUpperCase() + '] ' + s.blocks.join(sep) + ' &rarr; ' + s.formula + ' = <strong>' + s.result + '</strong></div>';
      }
      h += '<hr style="border-color:#0f3460;margin:4px 0">';
    }
    h += '<div class="re">' + d.result_label + ' = ' + d.result_value + '</div>';
    showR(h);
  }).catch(function(e) { showR('Backend error: ' + e.message); });
}

function showR(h) { document.getElementById('rc').innerHTML = h; }

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
